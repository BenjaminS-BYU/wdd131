<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Form</title>
    <meta name="description" content="A simple review form for users to submit their feedback.">
    <meta name="author" content="Benjamin Strong">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

        <label for="product">Product Name</label>
        <select name="product" id="product" required>
            <option value="" disabled selected>Select a Product...</option>
        </select>

        <fieldset>
            <legend>Overall Rating</legend>

            <div>
                <input type="radio" id="input5" name="rating" value="5" required>
                <label for="input5">5 ☆☆☆☆☆</label>
            </div>
            <div>
                <input type="radio" id="input4" name="rating" value="4" required>
                <label for="input4">4 ☆☆☆☆</label>
            </div>
            <div>
                <input type="radio" id="input3" name="rating" value="3" required>
                <label for="input3">3 ☆☆☆</label>
            </div>
            <div>
                <input type="radio" id="input2" name="rating" value="2" required>
                <label for="input2">2 ☆☆</label>
            </div>
            <div>
                <input type="radio" id="input1" name="rating" value="1" required>
                <label for="input1">1 ☆</label>
            </div>
        </fieldset>

        <label for="install">Date of Installation</label>
        <input type="date" name="install" id="install" required>

        <fieldset>
            <legend>Useful Features (check all that apply)</legend>
            <div>
          <input type="checkbox" id="feature1" name="features" value="durable">
          <label for="feature1">Durable</label>
        </div>

        <div>
          <input type="checkbox" id="feature2" name="features" value="easy-install">
          <label for="feature2">Easy to Install</label>
        </div>

        <div>
          <input type="checkbox" id="feature3" name="features" value="energy-efficient">
          <label for="feature3">Energy Efficient</label>
        </div>

        <div>
          <input type="checkbox" id="feature4" name="features" value="lightweight">
          <label for="feature4">Lightweight</label>
        </div>
        </fieldset>

        <label for="review">Written Review (optional)</label>
        <textarea name="review" id="review" rows="4"></textarea>

        <label for="username">Your Name (optional)</label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Submit Your Review">
        </form>
    </main>
    
    <footer>
        <p id="copyright"></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
