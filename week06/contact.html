<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techup - Contact</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <img src="images/techup-logo.jpg" alt="Techup Logo" class="logo" width="56" height="56">
      <h1>Techup</h1>
      <button id="menu">≡</button>
    </div>

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="contact.html" class="nav-link active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <h2 class="page-title">Contact Us</h2>
      <p class="lead">
        Have a project, question, or idea? Reach out and we'll get back to you quickly.
      </p>
    </section>

    <section class="section">
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button class="btn primary" type="submit">Send Message</button>
      </form>


    </section>

    <section class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2607.1134068653673!2d-113.31195592351595!3d49.19840817138019!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x536f26d6afcb0afb%3A0x12662afd808ab0bb!2sCardston%20Alberta%20Temple!5e0!3m2!1sen!2sca!4v1764989464861!5m2!1sen!2sca" width="600" height="450" title="Cardston Alberta Temple Location" allowfullscreen="" loading="lazy"></iframe>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
        <p id="copyright"></p>
        <p id="lastModified"></p>
    </div>
    </footer>
</body>
</html>
