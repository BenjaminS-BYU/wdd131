<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Techup — Contact</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Open+Sans:wght@400;600&family=Source+Code+Pro&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="images/logo-placeholder.png" alt="Techup logo" class="logo" width="56" height="56">
      <h1>Techup</h1>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="contact.html" class="nav-link active">Contact</a>
      <button id="cartToggle" class="cart-btn" aria-expanded="false">Cart (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <main class="contact-main">
    <section class="section">
      <h2>Contact Techup</h2>
      <form id="contactForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <div class="form-actions">
          <button type="submit" class="btn primary">Send</button>
          <button type="reset" class="btn">Reset</button>
        </div>

        <div id="formMsg" role="status" aria-live="polite" class="form-msg"></div>
      </form>

      <h3>Store Location & Hours</h3>
      <p>123 Techup Way, YourCity — Mon-Fri 9:00-18:00, Sat 10:00-16:00</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
        <p id="copyright"></p>
        <p id="lastModified"></p>
    </div>
    <div class="footer-right">
      <small>Pages: Home • About • Contact</small>
    </div>
  </footer>
</body>
</html>
